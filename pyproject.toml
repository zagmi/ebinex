[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebinexpy"
version = "0.1.0"
description = "📈 The only and most reliable bridge between the broker and you."
readme = "README.md"
authors = [
    { name = "Santiago Ramirez", email = "santiirepair@gmail.com" }
]

license = { text = "LGPL-2.1" }
requires-python = ">=3.10"
dependencies = [
    "PyJWT",
    "numpy",
    "pywin32",
    "varname",
    "selenium",
    "requests",
    "openai-whisper",
    "websocket-client"
]

[project.urls]
homepage = "https://github.com/zagmi/ebinex"
